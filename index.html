    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from

    // navigation stays same-origin with its initiator and a deduped page

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;

          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

    const resourceMap = {};
    for (const entry of extResources) {

    }

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

solid var(--hair)\">\n  <div style=\"max-width:1200px;margin:0 auto;padding:52px 24px 34px;display:grid;gap:40px;grid-template-columns:1.4fr 1fr 1fr 1fr\" data-hq=\"g4f\">\n    <div>\n      <div style=\"display:flex;align-items:center;gap:11px\">\n        <span style=\"position:relative;width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(150deg,var(--em),var(--em-d))\">\n          <span style=\"width:13px;height:13px;background:var(--gold-l);transform:rotate(45deg);border-radius:2px\"><\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-weight:700;font-size:17px;letter-spacing:-.02em\">Halaqa<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin-top:14px;max-width:22em;font-size:13.5px;line-height:1.6;color:var(--mute);font-weight:450\">{{ t.footer.about }}<\u002Fp>\n      <div style=\"margin-top:18px;display:flex;gap:6px;padding:4px;border-radius:12px;border:1px solid var(--line);width:max-content\" role=\"group\" aria-label=\"{{ t.langLabel }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ setTr }}\" style=\"{{ pillTr }}\">Türkçe<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ setEn }}\" style=\"{{ pillEn }}\">English<\u002Fbutton>\n        <button type=\"button\" sc-camel-on-click=\"{{ setAr }}\" style=\"{{ pillAr }}\">العربية<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-for list=\"{{ t.footer.cols }}\" as=\"c\" hint-placeholder-count=\"3\">\n      <div>\n        <div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-d);font-weight:700\">{{ c.k }}<\u002Fdiv>\n        <div style=\"margin-top:14px;display:grid;gap:10px\">\n          <sc-for list=\"{{ c.links }}\" as=\"l\" hint-placeholder-count=\"3\">\n            <a href=\"#top\" style=\"font-size:13.5px;color:var(--mute);font-weight:500\" style-hover=\"color:var(--ink)\">{{ l }}<\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"max-width:1200px;margin:0 auto;padding:0 24px 40px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;font-size:12.5px;color:var(--mute);font-weight:500\">\n    <span>© 2026 Halaqa<\u002Fspan>\n    <span>{{ t.footer.made }}<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;tr&quot;,&quot;en&quot;,&quot;ar&quot;],&quot;default&quot;:&quot;tr&quot;,&quot;tsType&quot;:&quot;'tr'|'en'|'ar'&quot;}}\">\nconst STR = {\n  tr: {\n    themeLabel: \"Temayı değiştir\", langLabel: \"Dil seçimi\",\n    nav: { a: \"Tesbih\", b: \"Bahçe\", c: \"Halka\", d: \"Meydan\" },\n    cta: { primary: \"App Store'dan İndir\", secondary: \"Nasıl çalışır\", short: \"İndir\" },\n    hero: {\n      eyebrow: \"iOS için · Ücretsiz\",\n      title: \"Sükûnet, birlikte büyür.\",\n      sub: \"Halaqa; dijital tesbihin, zikir bahçenin ve aynı niyetle anan bir topluluğun buluştuğu yer. Sade bir arayüz, dingin bir ritim.\",\n      facts: [\n        { k: \"Yeni yayında\", v: \"App Store'da ilk sürüm\" },\n        { k: \"Ücretsiz\", v: \"Reklam yok, abonelik yok\" },\n        { k: \"TR · EN · AR\", v: \"Arapça için tam RTL\" }\n      ]\n    },\n    shots: {\n      title: \"Uygulamadan ekranlar.\", sub: \"Gerçek ekran görüntülerini bu çerçevelere sürükleyip bırakabilirsin.\",\n      hero: \"Ana ekran görüntüsünü buraya bırak\",\n      icon: \"Uygulama ikonu\",\n      a: \"Tesbih ekranı\", aLabel: \"Tesbih\",\n      b: \"Zikir Bahçesi ekranı\", bLabel: \"Zikir Bahçesi\",\n      c: \"Canlı oda ekranı\", cLabel: \"Halka\"\n    },\n    early: {\n      tag: \"Erken topluluk\",\n      title: \"İlk halkayı sen kur.\",\n      body: \"Halaqa yeni yayında. Şu an katılırsan topluluğu kuran ilk isimlerden olursun — açtığın oda, başlattığın kampanya, diktiğin ilk tohum bu topluluğun ilk izleri olur.\",\n      cards: [\n        { k: \"Ücretsiz\", v: \"Tüm özellikler açık\" },\n        { k: \"Reklamsız\", v: \"Takip yok, gürültü yok\" },\n        { k: \"iOS 16+\", v: \"iPhone için tasarlandı\" },\n        { k: \"TR · EN · AR\", v: \"RTL desteği ile\" }\n      ]\n    },\n    phone: { tesbih: \"Tesbih\", tapLabel: \"Zikir sayacına dokun\", streak: \"gün seri\", today: \"bugün\", drops: \"damla\", forSomeone: \"Bu zikri Ayşe için yaptın — ona bildirildi.\" },\n    ayah: { tr: \"“Beni anın, ben de sizi anayım.”\", ref: \"Bakara 152\" },\n    strip: [\n      { k: \"Zikir\", v: \"Dokun, say, sakinleş. Haptik geri bildirimle akıcı bir tesbih.\" },\n      { k: \"Topluluk\", v: \"Canlı halkalar, ortak hedefler, birlikte edilen dualar.\" },\n      { k: \"Huzur\", v: \"Reklamsız, gürültüsüz, dikkatini dağıtmayan bir arayüz.\" },\n      { k: \"Emanet\", v: \"Anonim mod, istatistik gizleme, Face ID ile sohbet kilidi.\" }\n    ],\n    f1: {\n      tag: \"Zikir & Tesbih\", title: \"Dijital tesbih, sessiz bir ritim.\",\n      body: \"Ekrana her dokunuşta yumuşak bir dalga ve hafif bir titreşim. Sayacın nerede kaldığını hatırlar, sen sadece kalbine odaklanırsın.\",\n      b: [\"Hazır zikirler ve serbest sayaç modu\", \"Esmâ-ül Hüsna: 99 isim, anlamlarıyla\", \"Kendi dualarını ekle, kendi setini kur\", \"“Biri için dua et” — zikrini bir isme adayabilirsin\"],\n      card1: \"Esmâ-ül Hüsna\", card1sub: \"99 ismi tek tek oku, anlamını gör, sayacına ekle.\",\n      card2: \"Klasik tesbih düzeni hazır; istersen kendi sayını belirle.\",\n      card3: \"Zikrini bir dosta ada; o da bildirim alsın.\"\n    },\n    f2: {\n      tag: \"Zikir Bahçesi\", title: \"Zikrettikçe yeşilen bir bahçe.\",\n      body: \"Her zikir bir su damlası kazandırır. Damlalarınla Kur'an'da anılan bitkileri büyütür, meyvelerini hasat eder, tohumlarını sevdiklerine gönderirsin.\",\n      b: [\"Hurma, zeytin ve nar — her biri kendi ayetiyle\", \"Hasat ettiğin meyve yeni tohuma dönüşür\", \"Takipçilerine tohum hediye et\", \"Bahçen, sürekliliğinin sessiz bir kaydıdır\"],\n      gardenTitle: \"Bahçem\", dropsLabel: \"Damla\", giftTitle: \"Tohum hediye et\", giftSub: \"Hasadından bir tohumu bir dostuna gönder.\"\n    },\n    f3: {\n      tag: \"Programlar & Kampanyalar\", title: \"Rehberli günler, ortak hedefler.\",\n      body: \"Niyetini seç, gerisini Halaqa hatırlatsın. Günlük kitler seni tesbihte adım adım okutur; kampanyalar ise binlerce kişinin zikrini tek bir hedefte birleştirir.\",\n      kits: [\n        { title: \"40 Besmele\", badge: \"7 gün\", body: \"Koruma niyetiyle her sabah kırk Besmele. Sabah hatırlatması açık.\", pct: \"62%\", meta: \"4/7 gün tamamlandı\" },\n        { title: \"Hz. Yûnus Duası\", badge: \"40 gün\", body: \"Darlıktan çıkış niyetiyle kırk gün, her akşam okunan rehberli program.\", pct: \"35%\", meta: \"14/40 gün tamamlandı\" },\n        { title: \"10.000 Salavat\", badge: \"Kampanya\", body: \"Topluluk kampanyası. Payını al, ilerleme halkası herkesle birlikte dolsun.\", pct: \"8%\", meta: \"İlk kampanya yeni başladı\" }\n      ]\n    },\n    f4: {\n      tag: \"Halka · Canlı Odalar\", title: \"Canlı halkalar, gerçek sohbet.\",\n      body: \"Sesli ve görüntülü odalar: sahnede konuşanlar, dinleyicide topluluk. Söz iste, öğretim tahtasında birlikte oku, kapıdan onayla giriş yapılsın.\",\n      b: [\"Sahne & dinleyici düzeni\", \"Söz isteme ve moderasyon\", \"Lazer işaretçili öğretim tahtası\", \"Birlikte video izleme\", \"Kitle ayarı: herkes / kadın / erkek\", \"Makam seviyesi ile oda açma\"],\n      live: \"Canlı\", listeners: \"örnek oda görünümü\", roomTitle: \"Cuma Halkası — Kehf Sûresi üzerine sohbet\",\n      board: \"Öğretim tahtası\", raise: \"Söz iste\", join: \"Odaya katıl\"\n    },\n    f5: {\n      tag: \"Meydan\", title: \"Topluluğun meydanı.\",\n      body: \"Dua istekleri, soru-cevap, dua kütüphanesi, namaz öğreticisi ve quizler bir arada. Kıble, vakitler ve Kur'an her zaman bir dokunuş uzağında.\",\n      quran: \"Kur'an-ı Kerim\", quranSub: \"Meal, sesli tilavet (Alafasy) ve çevrimdışı indirme.\",\n      times: \"Namaz vakitleri\", next: \"İkindiye 1 sa 12 dk\",\n      prayers: [{ n: \"İmsak\", t: \"04:12\" }, { n: \"Güneş\", t: \"05:52\" }, { n: \"Öğle\", t: \"13:14\" }, { n: \"İkindi\", t: \"17:06\" }, { n: \"Akşam\", t: \"20:31\" }],\n      qibla: \"Kıble\", qiblaSub: \"Pusula ile hizala, yönünü bul.\"\n    },\n    how: {\n      title: \"Üç adımda başla.\",\n      steps: [\n        { n: \"1\", title: \"İndir ve niyet et\", body: \"Uygulamayı aç, günlük zikir hedefini ve niyetini seç. Kayıt bir dakikadan kısa.\" },\n        { n: \"2\", title: \"Her gün bir zikir\", body: \"Hatırlatma geldiğinde tesbihi aç, dokun ve say. Seri ve toplamların kendiliğinden işlenir.\" },\n        { n: \"3\", title: \"Bahçen ve halkan büyüsün\", body: \"Damlalarınla bahçeni büyüt, canlı halkalara katıl, kampanyalarda topluluğa omuz ver.\" }\n      ]\n    },\n    live: {\n      tag: \"Şu an\", title: \"kişi zikirde.\",\n      body: \"Halaqa'da hiç yalnız zikretmezsin. Aynı anda dua eden bir topluluğun içindesin.\",\n      k1: \"bugünkü zikir\", k2: \"açık canlı halka\", k3: \"aktif kampanya hedefi\", k4: \"dil · TR / EN / AR\"\n    },\n    all: {\n      title: \"Hepsi tek uygulamada.\", sub: \"Zikirden topluluğa, mesajlaşmadan gizliliğe — Halaqa'nın tamamı.\",\n      items: [\n        { k: \"Mesajlaşma\", v: \"Birebir ve topluluk sohbeti; foto, video, sesli mesaj, dosya.\" },\n        { k: \"Tek seferlik mesaj\", v: \"Görülünce kaybolan mesajlar, geri alma ve sabitleme.\" },\n        { k: \"Görüntülü & sesli arama\", v: \"1:1 arama; net ses, düşük veri kullanımı.\" },\n        { k: \"Dua istekleri\", v: \"Bir dua iste; topluluk senin için ansın.\" },\n        { k: \"Dua kütüphanesi\", v: \"Günlük dualar, kaynaklarıyla düzenli bir arşiv.\" },\n        { k: \"Namaz öğretici\", v: \"Adım adım kılınış rehberi, sade anlatım.\" },\n        { k: \"Quizler\", v: \"Kısa bilgi soruları; öğrenmeyi oyunlaştırmadan tutar.\" },\n        { k: \"Profil & yolculuk\", v: \"Bugün, seri, toplam; üyelik rozetleri ve ziyaretçiler.\" },\n        { k: \"Hicri yaşam muhasebesi\", v: \"Doğum günü ve muhasebe — astroloji yok, sadece tefekkür.\" },\n        { k: \"Sosyal\", v: \"Takip, dürtme, çevrimiçi durumu, insanları keşfet.\" },\n        { k: \"Halaqa Asistan\", v: \"Uygulama içi yapay zeka rehberlik ve destek.\" },\n        { k: \"Gizlilik\", v: \"Anonim mod, istatistik gizleme, Face ID ile sohbet kilidi.\" }\n      ]\n    },\n    final: { title: \"Bugün bir zikirle başla.\", body: \"Halaqa'yı indir, ilk damlanı kazan ve bahçenin ilk tohumunu ek.\", meta: \"Ücretsiz · iOS 16+ · Türkçe, English, العربية\" },\n    footer: {\n      about: \"Zikir, dua ve manevi topluluk için sakin bir alan.\",\n      cols: [\n        { k: \"Uygulama\", links: [\"Özellikler\", \"Zikir Bahçesi\", \"Halka\", \"Meydan\"] },\n        { k: \"Destek\", links: [\"Yardım merkezi\", \"İletişim\", \"Geri bildirim\"] },\n        { k: \"Yasal\", links: [\"Gizlilik politikası\", \"Kullanım şartları\", \"KVKK\"] }\n      ],\n      made: \"Sükûnetle hazırlandı.\"\n    }\n  },\n  en: {\n    themeLabel: \"Switch theme\", langLabel: \"Language\",\n    nav: { a: \"Tasbih\", b: \"Garden\", c: \"Halaqa\", d: \"Square\" },\n    cta: { primary: \"Download on the App Store\", secondary: \"How it works\", short: \"Get the app\" },\n    hero: {\n      eyebrow: \"For iOS · Free\",\n      title: \"Stillness grows together.\",\n      sub: \"Halaqa brings your digital tasbih, your garden of remembrance and a community of the same intention into one calm place.\",\n      facts: [\n        { k: \"Newly launched\", v: \"First release on the App Store\" },\n        { k: \"Free\", v: \"No ads, no subscription\" },\n        { k: \"TR · EN · AR\", v: \"Full RTL for Arabic\" }\n      ]\n    },\n    shots: {\n      title: \"Screens from the app.\", sub: \"Drag your real screenshots onto these frames.\",\n      hero: \"Drop the main screenshot here\",\n      icon: \"App icon\",\n      a: \"Tasbih screen\", aLabel: \"Tasbih\",\n      b: \"Garden screen\", bLabel: \"Garden of Dhikr\",\n      c: \"Live room screen\", cLabel: \"Halaqa\"\n    },\n    early: {\n      tag: \"Early community\",\n      title: \"Open the first circle.\",\n      body: \"Halaqa has just launched. Join now and you are among the first to build this community — the room you open, the campaign you start, the first seed you plant become its earliest traces.\",\n      cards: [\n        { k: \"Free\", v: \"Every feature unlocked\" },\n        { k: \"No ads\", v: \"No tracking, no noise\" },\n        { k: \"iOS 16+\", v: \"Designed for iPhone\" },\n        { k: \"TR · EN · AR\", v: \"With RTL support\" }\n      ]\n    },\n    phone: { tesbih: \"Tasbih\", tapLabel: \"Tap the dhikr counter\", streak: \"day streak\", today: \"today\", drops: \"drops\", forSomeone: \"You dedicated this dhikr to Aisha — she has been notified.\" },\n    ayah: { tr: \"“Remember Me, and I will remember you.”\", ref: \"Al-Baqarah 152\" },\n    strip: [\n      { k: \"Dhikr\", v: \"Tap, count, settle. A fluid tasbih with gentle haptics.\" },\n      { k: \"Community\", v: \"Live rooms, shared goals, prayers made together.\" },\n      { k: \"Calm\", v: \"No ads, no noise, nothing pulling at your attention.\" },\n      { k: \"Trust\", v: \"Anonymous mode, hidden stats, Face ID chat lock.\" }\n    ],\n    f1: {\n      tag: \"Dhikr & Tasbih\", title: \"A digital tasbih with a quiet rhythm.\",\n      body: \"Every tap answers with a soft ripple and a light haptic. It remembers where you left off, so you can stay with your heart.\",\n      b: [\"Curated dhikr sets and a free counter mode\", \"Asma ul-Husna: the 99 names with meanings\", \"Add your own supplications and build your set\", \"“Pray for someone” — dedicate your dhikr to a name\"],\n      card1: \"Asma ul-Husna\", card1sub: \"Read all 99 names, see the meaning, add it to your counter.\",\n      card2: \"The classic set is ready; or choose your own target.\",\n      card3: \"Dedicate your dhikr to a friend — they get a note.\"\n    },\n    f2: {\n      tag: \"Garden of Dhikr\", title: \"A garden that grows with your dhikr.\",\n      body: \"Each dhikr earns a drop of water. With your drops you raise the plants named in the Qur'an, harvest their fruit and gift the seeds to people you love.\",\n      b: [\"Date, olive and pomegranate — each with its verse\", \"Harvested fruit turns back into seeds\", \"Send seeds to your followers\", \"Your garden is a quiet record of consistency\"],\n      gardenTitle: \"My garden\", dropsLabel: \"Drops\", giftTitle: \"Gift a seed\", giftSub: \"Send one seed from your harvest to a friend.\"\n    },\n    f3: {\n      tag: \"Programs & Campaigns\", title: \"Guided days, shared goals.\",\n      body: \"Choose an intention and let Halaqa carry the reminders. Daily kits walk you through the tasbih; campaigns gather thousands of counts into one goal.\",\n      kits: [\n        { title: \"40 Basmalas\", badge: \"7 days\", body: \"Forty Basmalas each morning, with protection as the intention.\", pct: \"62%\", meta: \"4/7 days complete\" },\n        { title: \"Dua of Yunus\", badge: \"40 days\", body: \"Forty evenings of guided remembrance for relief from hardship.\", pct: \"35%\", meta: \"14/40 days complete\" },\n        { title: \"10,000 Salawat\", badge: \"Campaign\", body: \"A community goal. Take your share and watch the ring fill together.\", pct: \"8%\", meta: \"The first campaign has just begun\" }\n      ]\n    },\n    f4: {\n      tag: \"Halaqa · Live Rooms\", title: \"Live circles, real conversation.\",\n      body: \"Audio and video rooms with speakers on stage and the community listening. Raise your hand, read together on the teaching board, approve guests at the door.\",\n      b: [\"Stage & listener layout\", \"Hand raising and moderation\", \"Teaching board with laser pointer\", \"Watch video together\", \"Audience: everyone / women / men\", \"Room hosting unlocked by Maqam level\"],\n      live: \"Live\", listeners: \"example room view\", roomTitle: \"Friday Circle — reflections on Surah al-Kahf\",\n      board: \"Teaching board\", raise: \"Raise hand\", join: \"Join room\"\n    },\n    f5: {\n      tag: \"The Square\", title: \"Where the community gathers.\",\n      body: \"Prayer requests, Q&A, a library of supplications, a prayer tutor and quizzes in one place. Qibla, prayer times and the Qur'an are always one tap away.\",\n      quran: \"The Qur'an\", quranSub: \"Translation, recitation by Alafasy and offline download.\",\n      times: \"Prayer times\", next: \"1h 12m to Asr\",\n      prayers: [{ n: \"Fajr\", t: \"04:12\" }, { n: \"Sunrise\", t: \"05:52\" }, { n: \"Dhuhr\", t: \"13:14\" }, { n: \"Asr\", t: \"17:06\" }, { n: \"Maghrib\", t: \"20:31\" }],\n      qibla: \"Qibla\", qiblaSub: \"Align with the compass to find your direction.\"\n    },\n    how: {\n      title: \"Begin in three steps.\",\n      steps: [\n        { n: \"1\", title: \"Download and set an intention\", body: \"Open the app, pick your daily dhikr goal and your intention. Signing up takes under a minute.\" },\n        { n: \"2\", title: \"One dhikr a day\", body: \"When the reminder arrives, open the tasbih and count. Streaks and totals record themselves.\" },\n        { n: \"3\", title: \"Grow your garden and circle\", body: \"Raise plants with your drops, join live rooms and lend your count to campaigns.\" }\n      ]\n    },\n    live: {\n      tag: \"Right now\", title: \"people in dhikr.\",\n      body: \"On Halaqa you never remember alone — you are inside a community praying at the same moment.\",\n      k1: \"dhikr today\", k2: \"live circles open\", k3: \"active campaign goal\", k4: \"languages · TR / EN / AR\"\n    },\n    all: {\n      title: \"All of it in one app.\", sub: \"From dhikr to community, messaging to privacy — the whole of Halaqa.\",\n      items: [\n        { k: \"Messaging\", v: \"One-to-one and community chat; photo, video, voice notes, files.\" },\n        { k: \"One-time messages\", v: \"Messages that vanish once seen, plus unsend and pinning.\" },\n        { k: \"Video & voice calls\", v: \"1:1 calls with clear audio and low data use.\" },\n        { k: \"Prayer requests\", v: \"Ask for a prayer; the community remembers you.\" },\n        { k: \"Dua library\", v: \"Daily supplications, organised with their sources.\" },\n        { k: \"Prayer tutor\", v: \"A step-by-step guide to praying, plainly explained.\" },\n        { k: \"Quizzes\", v: \"Short knowledge rounds that keep learning gentle.\" },\n        { k: \"Profile & journey\", v: \"Today, streak, total; membership badges and visitors.\" },\n        { k: \"Hijri life reckoning\", v: \"Birthday and reflection — no astrology, only contemplation.\" },\n        { k: \"Social\", v: \"Follow, poke, online status, discover people.\" },\n        { k: \"Halaqa Assistant\", v: \"In-app AI guidance and support.\" },\n        { k: \"Privacy\", v: \"Anonymous mode, hidden stats, Face ID chat lock.\" }\n      ]\n    },\n    final: { title: \"Start today with one dhikr.\", body: \"Download Halaqa, earn your first drop and plant the first seed of your garden.\", meta: \"Free · iOS 16+ · Türkçe, English, العربية\" },\n    footer: {\n      about: \"A calm space for remembrance, prayer and spiritual company.\",\n      cols: [\n        { k: \"App\", links: [\"Features\", \"Garden of Dhikr\", \"Live rooms\", \"The Square\"] },\n        { k: \"Support\", links: [\"Help centre\", \"Contact\", \"Feedback\"] },\n        { k: \"Legal\", links: [\"Privacy policy\", \"Terms of use\", \"Data protection\"] }\n      ],\n      made: \"Made with stillness.\"\n    }\n  },\n  ar: {\n    themeLabel: \"تغيير المظهر\", langLabel: \"اللغة\",\n    nav: { a: \"التسبيح\", b: \"الحديقة\", c: \"الحلقة\", d: \"الساحة\" },\n    cta: { primary: \"حمّله من App Store\", secondary: \"كيف يعمل\", short: \"تحميل\" },\n    hero: {\n      eyebrow: \"لنظام iOS · مجانًا\",\n      title: \"السكينة تنمو معًا.\",\n      sub: \"حلقة تجمع سبحتك الرقمية وحديقة ذكرك ومجتمعًا يذكر بالنية ذاتها في مكان واحد هادئ.\",\n      facts: [\n        { k: \"صدر حديثًا\", v: \"الإصدار الأول على App Store\" },\n        { k: \"مجانًا\", v: \"بلا إعلانات ولا اشتراك\" },\n        { k: \"TR · EN · AR\", v: \"دعم كامل للكتابة من اليمين\" }\n      ]\n    },\n    shots: {\n      title: \"لقطات من التطبيق.\", sub: \"اسحب لقطات الشاشة الحقيقية وأفلتها في هذه الإطارات.\",\n      hero: \"أفلت اللقطة الرئيسية هنا\",\n      icon: \"أيقونة التطبيق\",\n      a: \"شاشة السبحة\", aLabel: \"السبحة\",\n      b: \"شاشة الحديقة\", bLabel: \"حديقة الذكر\",\n      c: \"شاشة الغرفة المباشرة\", cLabel: \"الحلقة\"\n    },\n    early: {\n      tag: \"مجتمع في بدايته\",\n      title: \"افتح الحلقة الأولى.\",\n      body: \"حلقة صدرت حديثًا. إن انضممت الآن ستكون من أوائل من يبنون هذا المجتمع — الغرفة التي تفتحها والحملة التي تبدأها وأول بذرة تزرعها ستكون أولى آثاره.\",\n      cards: [\n        { k: \"مجانًا\", v: \"كل الميزات متاحة\" },\n        { k: \"بلا إعلانات\", v: \"بلا تتبّع ولا ضجيج\" },\n        { k: \"iOS 16+\", v: \"مصمم لـ iPhone\" },\n        { k: \"TR · EN · AR\", v: \"بدعم الاتجاه من اليمين\" }\n      ]\n    },\n    phone: { tesbih: \"السبحة\", tapLabel: \"المس عدّاد الذكر\", streak: \"يومًا متواصلًا\", today: \"اليوم\", drops: \"قطرة\", forSomeone: \"أهديت هذا الذكر لعائشة — وقد أُبلغت بذلك.\" },\n    ayah: { tr: \"«فاذكروني أذكركم»\", ref: \"البقرة ١٥٢\" },\n    strip: [\n      { k: \"الذكر\", v: \"المس، وعُدّ، واهدأ. سبحة سلسة باهتزاز لطيف.\" },\n      { k: \"المجتمع\", v: \"حلقات مباشرة وأهداف مشتركة ودعاء جماعي.\" },\n      { k: \"الطمأنينة\", v: \"بلا إعلانات ولا ضجيج ولا ما يشتّت انتباهك.\" },\n      { k: \"الأمانة\", v: \"وضع مجهول، وإخفاء الإحصاءات، وقفل المحادثات ببصمة الوجه.\" }\n    ],\n    f1: {\n      tag: \"الذكر والسبحة\", title: \"سبحة رقمية بإيقاع هادئ.\",\n      body: \"كل لمسة تُجيبك بموجة لطيفة واهتزاز خفيف. يحفظ العدّاد موضعك لتبقى مع قلبك.\",\n      b: [\"أذكار مُعدّة ووضع عدّاد حر\", \"أسماء الله الحسنى: التسعة والتسعون بمعانيها\", \"أضِف أدعيتك وابنِ مجموعتك\", \"«ادعُ لأحد» — أهدِ ذكرك لاسمٍ تحبه\"],\n      card1: \"الأسماء الحسنى\", card1sub: \"اقرأ الأسماء التسعة والتسعين، واعرف معناها، وأضفها إلى عدّادك.\",\n      card2: \"الترتيب التقليدي جاهز، أو حدّد عددك بنفسك.\",\n      card3: \"أهدِ ذكرك لصديق، وسيصله إشعار.\"\n    },\n    f2: {\n      tag: \"حديقة الذكر\", title: \"حديقة تخضرّ بذكرك.\",\n      body: \"كل ذكر يمنحك قطرة ماء. وبقطراتك تُنمي النباتات المذكورة في القرآن، وتحصد ثمارها، وتُهدي بذورها لمن تحب.\",\n      b: [\"النخل والزيتون والرمان — كل واحدة بآيتها\", \"الثمر المحصود يعود بذورًا\", \"أهدِ البذور لمتابعيك\", \"حديقتك سجلّ هادئ لاستمرارك\"],\n      gardenTitle: \"حديقتي\", dropsLabel: \"قطرة\", giftTitle: \"أهدِ بذرة\", giftSub: \"أرسل بذرة من حصادك إلى صديق.\"\n    },\n    f3: {\n      tag: \"البرامج والحملات\", title: \"أيام مُرشدة وأهداف مشتركة.\",\n      body: \"اختر نيتك ودع حلقة تتولّى التذكير. البرامج اليومية تسير بك في السبحة، والحملات تجمع آلاف الأذكار في هدف واحد.\",\n      kits: [\n        { title: \"٤٠ بسملة\", badge: \"٧ أيام\", body: \"أربعون بسملة كل صباح بنية الحفظ والحماية.\", pct: \"62%\", meta: \"٤ من ٧ أيام\" },\n        { title: \"دعاء يونس\", badge: \"٤٠ يومًا\", body: \"أربعون مساءً من الذكر المُرشد لتفريج الضيق.\", pct: \"35%\", meta: \"١٤ من ٤٠ يومًا\" },\n        { title: \"١٠٠٠٠ صلاة\", badge: \"حملة\", body: \"هدف جماعي: خُذ نصيبك وشاهد الحلقة تكتمل معًا.\", pct: \"8%\", meta: \"الحملة الأولى بدأت للتو\" }\n      ]\n    },\n    f4: {\n      tag: \"الحلقة · غرف مباشرة\", title: \"حلقات مباشرة وحديث حقيقي.\",\n      body: \"غرف صوتية ومرئية: متحدثون على المنصة ومجتمع يستمع. اطلب الكلمة، واقرأ معًا على لوح التعليم، واعتمد الدخول من الباب.\",\n      b: [\"ترتيب المنصة والمستمعين\", \"طلب الكلمة والإشراف\", \"لوح تعليم بمؤشر ليزر\", \"مشاهدة الفيديو معًا\", \"الجمهور: الكل / النساء / الرجال\", \"فتح الغرف حسب المقام\"],\n      live: \"مباشر\", listeners: \"مثال لواجهة الغرفة\", roomTitle: \"حلقة الجمعة — وقفات مع سورة الكهف\",\n      board: \"لوح التعليم\", raise: \"اطلب الكلمة\", join: \"انضم للغرفة\"\n    },\n    f5: {\n      tag: \"الساحة\", title: \"ملتقى المجتمع.\",\n      body: \"طلبات الدعاء والأسئلة ومكتبة الأدعية ومعلّم الصلاة والاختبارات في مكان واحد. القبلة والمواقيت والقرآن على مسافة لمسة.\",\n      quran: \"القرآن الكريم\", quranSub: \"الترجمة وتلاوة العفاسي والتحميل للاستخدام دون اتصال.\",\n      times: \"مواقيت الصلاة\", next: \"ساعة و١٢ دقيقة للعصر\",\n      prayers: [{ n: \"الفجر\", t: \"٠٤:١٢\" }, { n: \"الشروق\", t: \"٠٥:٥٢\" }, { n: \"الظهر\", t: \"١٣:١٤\" }, { n: \"العصر\", t: \"١٧:٠٦\" }, { n: \"المغرب\", t: \"٢٠:٣١\" }],\n      qibla: \"القبلة\", qiblaSub: \"وجّه البوصلة لتجد اتجاهك.\"\n    },\n    how: {\n      title: \"ابدأ في ثلاث خطوات.\",\n      steps: [\n        { n: \"١\", title: \"حمّل وانوِ\", body: \"افتح التطبيق واختر هدفك اليومي ونيتك. التسجيل أقل من دقيقة.\" },\n        { n: \"٢\", title: \"ذكر كل يوم\", body: \"عند وصول التذكير افتح السبحة وعُدّ. تُسجّل السلسلة والمجموع تلقائيًا.\" },\n        { n: \"٣\", title: \"لتنمُ حديقتك وحلقتك\", body: \"أنمِ نباتاتك بقطراتك، وانضم للغرف المباشرة، وشارك في الحملات.\" }\n      ]\n    },\n    live: {\n      tag: \"الآن\", title: \"شخصًا في الذكر.\",\n      body: \"في حلقة لا تذكر وحدك — أنت داخل مجتمع يدعو في اللحظة ذاتها.\",\n      k1: \"ذكرًا اليوم\", k2: \"حلقة مباشرة مفتوحة\", k3: \"هدف حملة نشط\", k4: \"لغات · TR / EN / AR\"\n    },\n    all: {\n      title: \"كل ذلك في تطبيق واحد.\", sub: \"من الذكر إلى المجتمع، ومن المحادثات إلى الخصوصية — حلقة كاملة.\",\n      items: [\n        { k: \"المحادثات\", v: \"محادثات فردية وجماعية: صور وفيديو ورسائل صوتية وملفات.\" },\n        { k: \"رسالة لمرة واحدة\", v: \"رسائل تختفي بعد قراءتها، مع التراجع والتثبيت.\" },\
